name: Streak Keeper

on:
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keep-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit only if no commit today
        run: |
          export TZ="Asia/Kolkata"

          TODAY=$(date +%Y-%m-%d)
          echo "Today (IST): $TODAY"

          COMMITS_TODAY=$(git log \
            --since="$TODAY 00:00:00" \
            --until="$TODAY 23:59:59" \
            --oneline | wc -l)

          echo "Commits found today: $COMMITS_TODAY"

          if [ "$COMMITS_TODAY" -gt 0 ]; then
            echo "A commit already exists today."
            exit 0
          fi

          echo "Creating streak commit."

          echo "$(date '+%Y-%m-%d %H:%M:%S %Z') - streak kept" >> streak-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streak-log.txt
          git commit -m "chore: keep streak alive ($TODAY)"

          git push origin HEAD:${GITHUB_REF_NAME}
